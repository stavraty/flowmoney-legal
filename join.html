  <style>
    :root {
      color-scheme: dark;
      --bg: #060a10;
      --card: #0f141b;
      --card-2: #151b24;
      --line: #ffffff14;
      --text: #f4f7fb;
      --muted: #8d98aa;
      --green: #34c759;
      --green-deep: #1f7a3a;
      --green-glow: #34c75933;
      --red: #f4435f;
      font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      color: var(--text);
      background:
        radial-gradient(520px 380px at 85% -5%, #1b5e2d55, transparent 70%),
        radial-gradient(420px 320px at 0% 105%, #14452133, transparent 70%),
        linear-gradient(#ffffff06 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(90deg, #ffffff06 1px, transparent 1px) 0 0 / 28px 28px,
        var(--bg);
    }
    main {
      width: min(100%, 420px); padding: 32px 22px 24px; text-align: center;
      background: linear-gradient(180deg, #121922, var(--card));
      border: 1px solid var(--line); border-radius: 32px;
      box-shadow: 0 30px 80px #000a, inset 0 1px 0 #ffffff10;
    }
    .logo {
      width: 96px; height: 96px; margin: 0 auto 20px; display: block;
      border-radius: 26px; border: 1px solid #34c75955;
      box-shadow: 0 0 0 6px #34c7590d, 0 12px 44px var(--green-glow);
    }
    h1 { margin: 0 0 8px; font: 400 34px/1.1 ui-serif, "New York", Georgia, serif; letter-spacing: -.01em; }
    #intro { margin: 0 auto 24px; max-width: 30ch; font-size: 16px; line-height: 1.5; color: var(--muted); }

    .code-box {
      display: block; width: 100%; margin: 0 0 14px; padding: 16px 12px 14px;
      background: #34c7590f; border: 1px dashed #34c75966; border-radius: 20px;
      color: var(--green); cursor: pointer; font: inherit; text-align: center;
      transition: background .15s, border-color .15s, transform .1s;
    }
    .code-box:hover { background: #34c75916; border-color: #34c759aa; }
    .code-box:active { transform: scale(.985); }
    #code { display: block; font: 700 32px/1.2 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .14em; padding-left: .14em; overflow-wrap: anywhere; }
    #copyLabel { display: block; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .code-box.done { background: #34c75924; border-style: solid; border-color: var(--green); }
    .code-box.done #copyLabel { color: var(--green); }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      min-height: 54px; padding: 14px 16px; margin-top: 10px; border-radius: 18px;
      font: inherit; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; border: 0;
      transition: filter .15s, transform .1s;
    }
    .btn:active { transform: scale(.985); }
    .primary { background: var(--green); color: #04140a; box-shadow: 0 10px 30px #34c75940; }
    .primary:hover { filter: brightness(1.07); }
    .secondary { background: var(--card-2); color: var(--text); border: 1px solid var(--line); }
    .secondary:hover { background: #1b232e; }
    .btn svg { width: 20px; height: 20px; flex: none; fill: currentColor; }

    #hint { margin: 18px 4px 0; font-size: 13.5px; line-height: 1.55; color: var(--muted); }
    #invalid { margin: 0 0 20px; padding: 14px 16px; border-radius: 16px; background: #f4435f14; border: 1px solid #f4435f55; color: #ff8a9c; font-size: 15px; line-height: 1.5; }
    #status { min-height: 1.2em; margin: 8px 0 0; font-size: 13px; color: var(--green); }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid #e19b24; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    @media (max-width: 360px) { #code { font-size: 26px; } h1 { font-size: 30px; } }
  </style>
</head>

    <h1>FamMoney</h1>
    <p id="intro">You’re invited to a shared space.</p>

    <div id="invite" hidden>
      <button class="code-box" id="copy" type="button">
        <span id="code"></span>
        <span id="copyLabel">Copy code</span>
      </button>
      <a class="btn primary" id="open" href="#">Open FamMoney</a>
    </div>

    <p id="invalid" hidden>This invitation link is invalid. Ask the sender for a new link.</p>

    <a class="btn secondary" id="store" href="https://apps.apple.com/us/app/fammoney-family-budgeting/id6760046968">

    <p id="hint" hidden>Install FamMoney, then return to this invitation or enter the code in Spaces.</p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const translations = {
      en: ['You’re invited to a shared space.', 'Open FamMoney', 'Copy code', 'Install FamMoney, then return to this invitation or enter the code in Spaces.', 'This invitation link is invalid. Ask the sender for a new link.', 'Download on the App Store', 'Code copied', 'Select and copy the code above.'],
      uk: ['Вас запрошено до спільного простору.', 'Відкрити FamMoney', 'Копіювати код', 'Встановіть FamMoney, потім поверніться до запрошення або введіть код у розділі «Простори».', 'Недійсне посилання. Попросіть відправника надіслати нове запрошення.', 'Завантажити в App Store', 'Код скопійовано', 'Виділіть і скопіюйте код вище.'],
      ru: ['Вас пригласили в общее пространство.', 'Открыть FamMoney', 'Копировать код', 'Установите FamMoney, затем вернитесь к приглашению или введите код в разделе «Пространства».', 'Недействительная ссылка. Попросите отправителя прислать новое приглашение.', 'Скачать в App Store', 'Код скопирован', 'Выделите и скопируйте код выше.'],
      de: ['Du bist zu einem gemeinsamen Bereich eingeladen.', 'FamMoney öffnen', 'Code kopieren', 'Installiere FamMoney und kehre dann zur Einladung zurück oder gib den Code unter „Bereiche“ ein.', 'Dieser Einladungslink ist ungültig. Bitte um einen neuen Link.', 'Im App Store laden', 'Code kopiert', 'Markiere und kopiere den Code oben.'],
      es: ['Te han invitado a un espacio compartido.', 'Abrir FamMoney', 'Copiar código', 'Instala FamMoney y vuelve a esta invitación o introduce el código en Espacios.', 'El enlace no es válido. Pide una nueva invitación.', 'Descargar en el App Store', 'Código copiado', 'Selecciona y copia el código de arriba.'],
      fr: ['Vous êtes invité dans un espace partagé.', 'Ouvrir FamMoney', 'Copier le code', 'Installez FamMoney, puis revenez à cette invitation ou saisissez le code dans Espaces.', 'Ce lien est invalide. Demandez une nouvelle invitation.', 'Télécharger sur l’App Store', 'Code copié', 'Sélectionnez et copiez le code ci-dessus.'],
      it: ['Sei invitato in uno spazio condiviso.', 'Apri FamMoney', 'Copia codice', 'Installa FamMoney, poi torna a questo invito o inserisci il codice in Spazi.', 'Link non valido. Chiedi un nuovo invito.', 'Scarica su App Store', 'Codice copiato', 'Seleziona e copia il codice qui sopra.'],
      pl: ['Zaproszono Cię do wspólnej przestrzeni.', 'Otwórz FamMoney', 'Kopiuj kod', 'Zainstaluj FamMoney, a potem wróć do zaproszenia lub wpisz kod w sekcji Przestrzenie.', 'Link jest nieprawidłowy. Poproś o nowe zaproszenie.', 'Pobierz z App Store', 'Kod skopiowany', 'Zaznacz i skopiuj kod powyżej.'],
      pt: ['Você recebeu um convite para um espaço compartilhado.', 'Abrir FamMoney', 'Copiar código', 'Instale o FamMoney e volte a este convite ou insira o código em Espaços.', 'Link inválido. Peça um novo convite.', 'Baixar na App Store', 'Código copiado', 'Selecione e copie o código acima.']
    };
    const language = (navigator.language || 'en').split('-')[0];
    const words = translations[language] || translations.en;
    document.documentElement.lang = translations[language] ? language : 'en';
    const element = id => document.getElementById(id);
    // [intro, open, copyLabel, hint, invalid, storeLabel]
    ['intro', 'open', 'copyLabel', 'hint', 'invalid', 'storeLabel'].forEach((id, index) => { element(id).textContent = words[index]; });
    const code = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
    const valid = /^[A-Z0-9]{8}$/.test(code);
    element('invite').hidden = !valid;
    element('hint').hidden = !valid;
    element('invalid').hidden = valid;
    if (valid) {
      element('code').textContent = code;
      element('open').href = 'fammoney://join?code=' + encodeURIComponent(code);
      element('copy').setAttribute('aria-label', words[2] + ': ' + code);
      let timer;
      element('copy').addEventListener('click', async () => {
        const box = element('copy');
        try {
          await navigator.clipboard.writeText(code);
          element('status').textContent = words[6];
          element('copyLabel').textContent = '✓ ' + words[6];
          box.classList.add('done');
          clearTimeout(timer);
          timer = setTimeout(() => {
            box.classList.remove('done');
            element('copyLabel').textContent = words[2];
          }, 2000);
        } catch {
          const range = document.createRange();
          range.selectNodeContents(element('code'));
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          element('status').textContent = words[7];
        }
      });
    }
  </script>
